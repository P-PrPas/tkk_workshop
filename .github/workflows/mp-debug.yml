name: mediapipe macOS experiments (temporary)

# Temporary: find out why MediaPipe's hand tracker aborts on macOS. Runs only when this file changes.
on:
  push:
    branches: [feat/installer]
    paths: [".github/workflows/mp-debug.yml"]

jobs:
  experiments:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mediapipe 1.0.1 (what the app pins) and 0.10.x in a second venv
        run: |
          pip install -q mediapipe==1.0.1 numpy
          python -m venv /tmp/v010
          /tmp/v010/bin/pip install -q "mediapipe==0.10.21" "numpy<2"
          python -c "import mediapipe; print('1.x venv:', mediapipe.__version__)"
          /tmp/v010/bin/python -c "import mediapipe; print('0.10 venv:', mediapipe.__version__)"
      - name: Run the experiments
        shell: python
        run: |
          import subprocess, sys, textwrap
          TASK = "data/hand_landmarker.task"
          HEAD = "import os, sys\n{pre}\nimport numpy as np, mediapipe as mp\nfrom mediapipe.tasks import python as mpp\nfrom mediapipe.tasks.python import vision as mpv\n"
          TAIL = "\nh = mpv.HandLandmarker.create_from_options(o)\nh.detect_for_video(mp.Image(image_format=mp.ImageFormat.SRGB, data=np.zeros((480,640,3),np.uint8)), 1)\nprint('RESULT_OK')\n"
          ENV = 'os.environ["MEDIAPIPE_DISABLE_GPU"] = "1"'
          def opts(base, mode="VIDEO", extra=""):
              return f"o = mpv.HandLandmarkerOptions(base_options={base}, running_mode=mpv.RunningMode.{mode}, num_hands=2{extra})"
          CPU = f'mpp.BaseOptions(model_asset_path="{TASK}", delegate=mpp.BaseOptions.Delegate.CPU)'
          DEF = f'mpp.BaseOptions(model_asset_path="{TASK}")'
          BUF = f'mpp.BaseOptions(model_asset_buffer=open("{TASK}","rb").read(), delegate=mpp.BaseOptions.Delegate.CPU)'
          cases = {
            "A cpu delegate + env (what the app does)": (ENV, opts(CPU)),
            "B cpu delegate, no env": ("", opts(CPU)),
            "C default delegate, no env": ("", opts(DEF)),
            "D default delegate + env": (ENV, opts(DEF)),
            "E cpu + env, IMAGE mode": (ENV, opts(CPU, "IMAGE")),
            "F cpu + env, model as buffer": (ENV, opts(BUF)),
          }
          legacy = ("", "import mediapipe as mp\nprint('has solutions:', hasattr(mp, 'solutions'))\nh = mp.solutions.hands.Hands(static_image_mode=True)\nh.process(np.zeros((480,640,3),np.uint8))\nprint('RESULT_OK')")
          def run(py, name, code):
              r = subprocess.run([py, "-c", code], capture_output=True, text=True, timeout=180)
              err = [l for l in (r.stderr + r.stdout).splitlines() if "Check failed" in l or "Error" in l or "error" in l][-2:]
              print(f"{'OK  ' if 'RESULT_OK' in r.stdout else 'FAIL'} exit={r.returncode:>4}  {name}  {' | '.join(e.strip()[:110] for e in err)}", flush=True)
          for label, py in (("mediapipe 1.0.1", sys.executable), ("mediapipe 0.10.21", "/tmp/v010/bin/python")):
              print("====", label)
              for name, (pre, body) in cases.items():
                  run(py, name, HEAD.format(pre=pre) + body + TAIL)
              run(py, "G legacy mp.solutions.hands", "import numpy as np\n" + legacy[1])
