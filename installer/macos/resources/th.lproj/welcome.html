<h2>ยินดีต้อนรับสู่ตัวติดตั้ง Cuptick</h2>
<p>ตัวติดตั้งนี้จะติดตั้ง Cuptick ลงในโฟลเดอร์ Applications ของคุณ รวมทุกอย่างที่ต้องใช้แล้ว รวมถึงโมเดลตรวจจับ จึงไม่ต้องใช้อินเทอร์เน็ต</p>
<p>ต้องใช้ Mac ที่เป็น@CHIP@ และ macOS @MINOS@ ขึ้นไป</p>
<p>หากมีรุ่นเดิมติดตั้งอยู่ ตัวติดตั้งจะแทนที่ให้ ติดตั้งซ้ำได้ตลอดเวลา</p>
