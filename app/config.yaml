# ค่าที่ต้องจูนหน้างาน — แสงในห้องจริงไม่เคยเหมือนตอนทดสอบ
model_path: models/best.pt   # มี NVIDIA GPU → torch ใช้ CUDA เอง (เร็ว+ทน)
                             # CPU ล้วน → models/best.onnx (export ให้อัตโนมัติ, ต้องมี onnxruntime)
                             # แผนสำรอง: yolo11m.pt + cup_class 41
cup_class: 0                  # 0 = best (1 คลาส) · 41 = yolo11m.pt (COCO)
device:                       # เว้นว่าง = เลือกเอง · cuda = NVIDIA · mps = Apple Silicon · cpu = บังคับ CPU
camera_index: 0               # ไม่ติด ลอง 1 หรือ 2
mirror: true                  # กลับซ้าย-ขวาแบบกระจก (selfie view)

# --- หน้าต่างแสดงผล (ลากขอบปรับขนาดได้ / กด f = เต็มจอ / q ออก) ---
window_width: 1280            # ความกว้างหน้าต่างตอนเปิด
camera_width: 1280            # ขอความละเอียดจากกล้อง — สูงขึ้น = HUD คมบนโปรเจกเตอร์ (เว้นว่าง = ใช้ค่ากล้อง)
camera_height: 720

# --- ตรวจแก้ว ---
imgsz: 480                    # เล็กลง = เร็วขึ้น (640 แม่นกว่านิด · 384 เร็วกว่าอีก)
conf: 0.25                    # ตรวจไม่เจอ → ลด (0.15) · เจอมั่ว → เพิ่ม
cup_memory_frames: 15         # แก้วโดนมือบัง → ใช้กล่องเดิมต่ออีกกี่เฟรม

# --- ตัดสิน "ถือแก้ว" (ไม่ดูว่ากำหรือแบ — แก้วไม่มีหูมือดูเหมือนแบ) ---
grip_min_points: 10           # จุดมือ (จาก 21) ต้องตกในกล่องแก้วอย่างน้อยกี่จุด — มือ "ห่อ" แก้ว
grip_box_margin: 0.35         # ขยายขอบกล่องแก้ว (เท่าตัวแก้ว) ก่อนนับจุด — แก้วมีหู มือจับที่หูจะอยู่ข้างกล่อง
grip_max_size_ratio: 4.0      # มือ/แก้ว ต้องขนาดใกล้กัน (กันมือชี้จากไกลแล้วทับกล่อง)
hold_frames: 3                # เห็นติดกันกี่เฟรมจึงขึ้น HOLDING
release_frames: 6             # หายติดกันกี่เฟรมจึงเลิก (มากกว่า hold_frames = ไม่กระพริบ)
