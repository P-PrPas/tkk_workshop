# ค่าที่ต้องจูนหน้างาน — แสงในห้องจริงไม่เคยเหมือนตอนทดสอบ
model_path: models/best.pt   # แผนสำรอง: yolo11m.pt (โหลดเอง) + cup_class: 41
cup_class: 0                  # 0 = best.pt (1 คลาส) · 41 = yolo11m.pt (COCO)
camera_index: 0               # ไม่ติด ลอง 1 หรือ 2
conf: 0.25                    # ตรวจไม่เจอแก้ว → ลดลง (0.15) · เจอมั่ว → เพิ่มขึ้น
hold_frames: 3               # เห็นติดกันกี่เฟรมจึงขึ้น HOLDING (กล้อง ~5-8 FPS อย่าตั้งสูง)
release_frames: 6             # หายติดกันกี่เฟรมจึงเลิก (มากกว่า hold_frames = ไม่กระพริบ)
fist_threshold: 1             # นิ้วเหยียด <= ค่านี้ = กำ (ถ้ากำแล้วไม่ติด ลอง 2)
