# ค่าที่ต้องจูนหน้างาน — แสงในห้องจริงไม่เคยเหมือนตอนทดสอบ
model_path: auto             # auto = มี CUDA/MPS ใช้ models/cup_v2.pt · CPU ล้วนใช้ models/cup_v2.onnx (ถ้ามีไฟล์)
                             # หรือระบุเอง เช่น models/cup_v2.pt · ไฟล์วางไว้ใน app/models/ (ไม่โหลดจากเน็ต)
                             # แผนสำรอง: yolo11m.pt + cup_class 41
cup_class: 0                  # 0 = best (1 คลาส) · 41 = yolo11m.pt (COCO)
device:                       # เว้นว่าง = auto (cuda→mps→cpu) · ใส่ cuda/mps/cpu เมื่ออยากบังคับ
camera_index: 0               # กล้องเริ่มต้น · สลับระหว่างรันได้ที่ปุ่ม "กล้อง" (คีย์ C)
camera_probe: 3               # ตอนเปิดแอป ลองกล้อง index 0..N-1 เพื่อทำรายการให้ปุ่มเลือก
mirror: true                  # กลับซ้าย-ขวาแบบกระจก (selfie view)

# --- หน้าต่างแสดงผล (ลากขอบปรับขนาดได้ / กด f = เต็มจอ / q ออก) ---
window_width: 1280            # ความกว้างหน้าต่างตอนเปิด
camera_width: 1280            # ขอความละเอียดจากกล้อง — สูงขึ้น = HUD คมบนโปรเจกเตอร์ (เว้นว่าง = ใช้ค่ากล้อง)
camera_height: 720

# --- ตรวจแก้ว ---
imgsz: 480                    # เล็กลง = เร็วขึ้น (640 แม่นกว่านิด · 384 เร็วกว่าอีก)
conf: 0.01                    # เกณฑ์เริ่ม ID แก้วใหม่ · ปรับได้ด้านขวา (ID เดิมใช้คะแนนต่ำช่วยติดตาม)
track_low_conf: 0.01          # คะแนนต่ำสุดสำหรับช่วยติดตามแก้วเดิม ไม่ใช้เริ่ม ID ใหม่
track_buffer: 30              # จำนวนเฟรมที่ ByteTrack เก็บ ID ที่หลุดไว้รอจับคู่กลับ
cup_memory_frames: 15         # แก้วโดนมือบัง → ใช้กล่องเดิมต่ออีกกี่เฟรม

# --- ตัดสิน "ถือแก้ว" (ไม่ดูว่ากำหรือแบ — แก้วไม่มีหูมือดูเหมือนแบ) ---
min_hand_detection_confidence: 0.3  # MediaPipe: เกณฑ์ตรวจพบมือ · ปรับได้ที่แถบขวา
min_hand_presence_confidence: 0.5   # MediaPipe: เกณฑ์ยืนยันว่ามืออยู่ในภาพ
min_tracking_confidence: 0.5        # MediaPipe: เกณฑ์ติดตามมือระหว่างเฟรม
grip_min_points: 10           # จุดมือ (จาก 21) ต้องตกในกล่องแก้วอย่างน้อยกี่จุด — มือ "ห่อ" แก้ว
grip_box_margin: 0.35         # ขยายขอบกล่องแก้ว (เท่าตัวแก้ว) ก่อนนับจุด — แก้วมีหู มือจับที่หูจะอยู่ข้างกล่อง
grip_max_size_ratio: 4.0      # มือ/แก้ว ต้องขนาดใกล้กัน (กันมือชี้จากไกลแล้วทับกล่อง)
hold_frames: 3                # เห็นติดกันกี่เฟรมจึงขึ้น HOLDING
release_frames: 6             # หายติดกันกี่เฟรมจึงเลิก (มากกว่า hold_frames = ไม่กระพริบ)
hand_grace_seconds: 0.4       # มือหาย: พัก progress เท่านี้ก่อนลด โดยไม่เติมเวลาช่วงที่หาย

# --- เช็กลิสต์ผู้ตรวจ (ชิ้นไหนถูกหยิบไปตรวจแล้ว) ---
pick_seconds: 1.0             # ถือสะสมกี่วินาทีจึงนับว่า "ตรวจแล้ว" · ปรับระหว่างรันได้ที่แถบขวา
                              #   ลดลง = ตรวจเร็วขึ้น · เพิ่ม = ต้องถือนานขึ้น (ไม่ขึ้นกับ FPS)
trail_length: 60              # เก็บเส้นทางแก้วกี่จุด (จุดละเฟรม) — 0 = ไม่วาดเส้นทาง
forget_seconds: 4             # แก้วที่ยังไม่ถูกตรวจ หายจากเฟรมนานเท่านี้ = ตัดออกจากเช็กลิสต์
                              #   (ที่ตรวจแล้วอยู่ยาวจนกด "เริ่มรอบใหม่")

# --- โหมด zone (ย้ายแก้วจากจุด A ไป B — กดปุ่ม "โหมด Zone" หรือคีย์ Z แล้ววาดกรอบบนภาพ) ---
# ใช้ hold_frames ด้านบนเป็นจำนวนเฟรมที่มือต้องจับแก้วใน A ก่อนขึ้น IN TRANSIT
zone_settle_frames: 6         # แก้วออกจาก A (ไม่เห็นมือ) / วางคืนใน A ติดกันกี่เฟรมจึงเปลี่ยนสถานะ
zone_handoff_seconds: 3.0     # id แก้วหาย (มือบัง) แล้วได้เลขใหม่: รับสถานะต่อถ้าโผล่ภายในกี่วินาที
zone_handoff_dist: 1.5        # ...และอยู่ห่างตำแหน่งสุดท้ายไม่เกินกี่เท่าของด้านยาวกล่อง
